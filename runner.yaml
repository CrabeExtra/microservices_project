
name: Build and Deploy

on:
  push:
    branches:
      - prod

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .NET services
        run: |
          dotnet publish ./Identity/Identity.csproj -c Release -o ./publish/Identity
          dotnet publish ./Activity/Activity.csproj -c Release -o ./publish/Activity
          dotnet publish ./Audit/Audit.csproj -c Release -o ./publish/Audit
          dotnet publish ./Contact/Contact.csproj -c Release -o ./publish/Contact

      - name: Build frontend
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build

