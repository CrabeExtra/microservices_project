
name: Build and Deploy

on:
  push:
    branches:
      - prod

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Provision server
        run: sudo bash ./scripts/provision.sh

      - name: Build frontend
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build

      - name: Build and deploy services
        continue-on-error: true
        run: bash ./scripts/deploy-services.sh

      - name: Deploy frontend
        continue-on-error: true
        run: |
          mkdir -p ~/Projects/Portfolio/Frontend
          rm -rf ~/Projects/Portfolio/Frontend/*
          cp -a ./Frontend/dist/. ~/Projects/Portfolio/Frontend/

      - name: Deploy NATS
        run: |
          install -m 755 ./nats-server ~/Projects/Portfolio/nats-server
