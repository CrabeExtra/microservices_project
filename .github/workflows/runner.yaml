
name: Build and Deploy

on:
  push:
    branches:
      - prod

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision server
        run: sudo bash ./provision.sh

      - name: Build .NET services
        run: |
          dotnet restore ./Identity/Identity.csproj
          dotnet publish ./Identity/Identity.csproj -c Release -o ./publish/Identity
          dotnet publish ./Activity/Activity.csproj -c Release -o ./publish/Activity
          dotnet publish ./Audit/Audit.csproj -c Release -o ./publish/Audit
          dotnet publish ./Contact/Contact.csproj -c Release -o ./publish/Contact

      - name: Build frontend
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build

      - name: Stop existing services
        run: |
          sudo systemctl stop identity activity audit contact nats || true

      - name: Deploy backend
        run: |
          rsync -av --delete ./publish/ ~/Projects/Portfolio/

      - name: Deploy frontend
        run: |
          mkdir -p ~/Projects/Portfolio/Frontend
          rsync -av --delete ./Frontend/dist/ ~/microservices_project/microservices_project/Frontend/

      - name: Deploy NATS
        run: |
          install -m 755 ./nats-server ~/microservices_project/microservices_project/nats-server

      - name: Start services
        if: always()
        run: |
          sudo systemctl start identity activity audit contact nats
