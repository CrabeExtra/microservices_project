
name: Build and Deploy

on:
  push:
    branches:
      - prod

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Provision server
        run: sudo bash ./scripts/provision.sh

      - name: Build frontend
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build

      - name: Build and deploy services
        continue-on-error: true
        run: bash ./scripts/deploy-services.sh

      - name: Deploy frontend
        continue-on-error: true
        run: |
          mkdir -p /Deployments/Portfolio/Frontend
          rm -rf ~/Deployments/Portfolio/Frontend/*
          cp -a ./Frontend/dist/. ~/Projects/Portfolio/Frontend/

      - name: Configure frontend permissions
        run: |
          sudo chgrp caddy /Deployments/Jude /Deployments/Jude/Projects /Deployments/Jude/Projects/Portfolio
          sudo chmod 710 /Deployments/Jude /Deployments/Jude/Projects /Deployments/Jude/Projects/Portfolio

          sudo chgrp -R caddy /Deployments/Jude/Projects/Portfolio/Frontend
          sudo chmod -R g+rX /Deployments/Jude/Projects/Portfolio/Frontend
